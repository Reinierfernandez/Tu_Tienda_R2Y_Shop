<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>R2Y Shop - Tienda Virtual</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Arial, sans-serif; }
        body { background-color: #f4f4f9; color: #333; }
        header { background-color: #1e1e24; color: white; padding: 20px; text-align: center; font-size: 24px; font-weight: bold; }
        .container { max-width: 1200px; margin: 20px auto; padding: 0 20px; }
        .catalogo { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .producto-card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; }
        .producto-card img { max-width: 100%; height: 200px; object-fit: cover; border-radius: 4px; }
        .producto-card h3 { margin: 10px 0; font-size: 18px; }
        .producto-card .precio { color: #2ecc71; font-weight: bold; font-size: 16px; margin-bottom: 10px; }
        .btn-whatsapp { display: inline-block; background-color: #25d366; color: white; padding: 10px 15px; text-decoration: none; border-radius: 5px; font-weight: bold; transition: background 0.3s; }
        .btn-whatsapp:hover { background-color: #128c7e; }
    </style>
</head>
<body>

    <header>
        🛒 CONGO MUSUNDI - R2Y Shop
    </header>

    <div class="container">
        <h2>Nuestro Catálogo</h2>
        <div id="catalogo" class="catalogo">
            <p>Cargando productos...</p>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        // Aquí conectaremos JavaScript con tu Supabase en el siguiente paso
        document.getElementById('catalogo').innerHTML = `
            <div class="producto-card">
                <img src="https://via.placeholder.com/250" alt="Producto de prueba">
                <h3>Producto de Prueba</h3>
                <div class="precio">$99.99</div>
                <a href="#" class="btn-whatsapp">Pedir por WhatsApp</a>
            </div>
        `;
    </script>
</body>
</html>
